<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic-Tac-Toe AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg">
<header class="top-bar">
    <div class="brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="brand-logo">
        <span class="brand-main">Phys AI</span>
        <span class="brand-sub">Smart Tic-Tac-Toe</span>
    </div>
    <nav class="nav-links">
        <a href="{{ url_for('play') }}" class="active">Play</a>
        <a href="{{ url_for('about') }}">About Project</a>
    </nav>
</header>

<main class="container">
    <section class="card">
        <h2 class="title">Play vs Intelligent Agent</h2>
        <p class="subtitle">Player <strong>(O)</strong> vs AI <strong>(X)</strong> – Minimax Algorithm</p>

        <div id="board" class="board"></div>

        <div class="controls">
            <button class="btn" onclick="resetGame()">Reset Game</button>
        </div>

        <div id="status" class="status"></div>
    </section>
</main>

<script>
    // مصفوفة تمثل اللوح (9 خانات)
    let board = [" "," "," "," "," "," "," "," "," "];
    let gameOver = false;

    const boardDiv = document.getElementById("board");
    const statusDiv = document.getElementById("status");

    // إنشاء 9 أزرار للخانات
    for (let i = 0; i < 9; i++) {
        const btn = document.createElement("button");
        btn.className = "cell";
        btn.dataset.index = i;
        btn.onclick = () => handleClick(i, btn);
        boardDiv.appendChild(btn);
    }

    function handleClick(i, btn) {
        if (gameOver || board[i] !== " ") return;

        // حركة اللاعب (O)
        board[i] = "O";
        btn.textContent = "O";

        if (checkEnd()) return;

        // طلب حركة الـ AI من الباك إند
        fetch("/ai-move", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ board: board })
        })
        .then(response => response.json())
        .then(data => {
            const m = data.move;
            if (m !== null && !gameOver && board[m] === " ") {
                board[m] = "X";
                document.querySelector(`button[data-index='${m}']`).textContent = "X";
                checkEnd();
            }
        });
    }

    function checkEnd() {
        const lines = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];

        for (const [a,b,c] of lines) {
            if (board[a] !== " " && board[a] === board[b] && board[b] === board[c]) {
                statusDiv.textContent = "Winner: " + board[a];
                statusDiv.classList.add("status-win");
                gameOver = true;
                return true;
            }
        }

        if (!board.includes(" ")) {
            statusDiv.textContent = "Draw";
            statusDiv.classList.add("status-draw");
            gameOver = true;
            return true;
        }

        statusDiv.textContent = "Your turn (O)";
        return false;
    }

    function resetGame() {
        board = [" "," "," "," "," "," "," "," "," "];
        gameOver = false;
        statusDiv.textContent = "Your turn (O)";
        statusDiv.className = "status";
        document.querySelectorAll(".cell").forEach(b => b.textContent = "");
    }

    // تشغيل أولي
    resetGame();
</script>
</body>
</html>
